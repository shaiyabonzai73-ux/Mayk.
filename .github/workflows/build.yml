name: Build Mayk APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: |
          unzip -o mayk-apk.zip
          cd mayk-apk
          gradle assembleDebug --no-daemon
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mayk-apk/app/build/outputs/apk/debug/app-debug.apk mayk-debug.apk
          gh release create "v${{ github.run_number }}" mayk-debug.apk --title "Mayk build ${{ github.run_number }}" --notes "Mayk APK"
